# Проверки при каждом пуше: автотесты на локальной среде, уязвимости зависимостей, скрипты выкладки.
name: Проверки

on:
  push:
    branches: [main, backend]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Локальная среда (база, хранилище, почта, сайт)
        run: ./start.sh

      - name: Библиотеки сервера
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Автотесты
        working-directory: server
        run: npm test

      - name: Уязвимости в библиотеках
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Проверка скриптов выкладки
        run: |
          shellcheck -S warning deploy/server/*.sh start.sh
          docker compose -f deploy/compose.prod.yml config -q
        env:
          DB_PASSWORD: x
          APP_TAG: x
          ENV_FILE: ${{ github.workspace }}/.env

      - name: Конфиг nginx собирается
        run: |
          mkdir -p /tmp/ng/live/example.ru /tmp/ng/shared
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=example.ru \
            -keyout /tmp/ng/live/example.ru/privkey.pem -out /tmp/ng/live/example.ru/fullchain.pem 2>/dev/null
          echo 'add_header X-Test "1" always;' > /tmp/ng/shared/nginx-headers.conf
          sed -e 's/__DOMAIN__/example.ru/g' -e '/listen \[::\]/d' -e 's#/etc/letsencrypt#/tmp/ng#g' -e 's#/srv/nika/shared#/tmp/ng/shared#g' \
            deploy/nginx/nika.conf > /tmp/ng/nika.conf
          docker run --rm -v /tmp/ng:/tmp/ng:ro nginx:1.27-alpine sh -c \
            'cp /tmp/ng/nika.conf /etc/nginx/conf.d/default.conf && nginx -t'

      - name: Логи, если упало
        if: failure()
        run: docker compose logs --tail=100
