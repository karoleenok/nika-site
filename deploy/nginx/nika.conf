# Боевой конфиг nginx. __DOMAIN__ подставляет deploy/server/get-cert.sh.
# Заголовки безопасности и CSP лежат в /srv/nika/shared/nginx-headers.conf: их пишет каждая выкладка.
# Важно: add_header внутри location отменяет заголовки уровня server, поэтому файл подключается в каждом location.

limit_req_zone $binary_remote_addr zone=nika_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

# www → без www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nika_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/nika/current/public;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API: лимит частоты на входе, настоящий адрес посетителя для лимитов сервера
    location /api/ {
        include /srv/nika/shared/nginx-headers.conf;
        limit_req zone=nika_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Перезаписываем, а не дополняем: подделать адрес заголовком из браузера нельзя
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
    }

    # Служебные и скрытые файлы не отдаём
    location ~ /\.            { deny all; return 404; }
    location ~* \.(md|sql|sh|yml|yaml|log|bak|env)$ { deny all; return 404; }

    location ~* \.(woff2?)$ {
        include /srv/nika/shared/nginx-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.(css|js|svg|webp|avif|png|jpe?g|ico|mp4|webm)$ {
        include /srv/nika/shared/nginx-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        include /srv/nika/shared/nginx-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
